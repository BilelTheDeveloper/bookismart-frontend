<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Bookiify : Smart Booking, Better Business.</title>
    <script>
      /* Anti-FOUC: apply saved theme + language direction before first paint */
      (function () {
        try {
          var t = localStorage.getItem("bookiify_theme");
          if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var el = document.documentElement;
          if (t === "dark") el.classList.add("dark");
          el.style.colorScheme = t;
          var lang = localStorage.getItem("bookiify_lang") || "fr";
          el.lang = lang;
          el.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
